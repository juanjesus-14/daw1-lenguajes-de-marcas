<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formulario Básico</title>
</head>
<body>

    <h2>Registro</h2>

    <form id="formulario">

        Nombre:
        <input type="text" id="nombre"><br><br>

        Email:
        <input type="text" id="email"><br><br>

        Teléfono:
        <input type="text" id="telefono"><br><br>

        Edad:
        <input type="number" id="edad"><br><br>

        Modalidad:
        <input type="radio" id="online" name="modalidad"> Online
        <input type="radio" id="presencial" name="modalidad"> Presencial
        <br><br>

        <button type="submit">Enviar</button>

    </form>

    <p id="mensaje"></p>

    <script src="formularioCompleto.js"></script>
</body>
</html>
