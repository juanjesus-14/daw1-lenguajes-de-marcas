<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de registro</title>
</head>
<body>
    <form action="" method="POST" style="border:1px solid black; padding:20px; width:750px;">
        <h1><strong>Formulario de registro</strong></h1>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" maxlength="50"><br><br>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" maxlength="50"><br><br>

        <label>Sexo:</label>
        <input type="radio" id="hombre" name="sexo" value="hombre">
        <label for="hombre">hombre</label>
        <input type="radio" id="mujer" name="sexo" value="mujer">
        <label for="mujer">mujer</label><br><br>

        <label for="correo">Correo:</label>
        <input type="text" id="correo" name="correo"><br><br>

        <label for="poblacion">Poblacion:</label>
        <select id="poblacion" name="poblacion">
            <option value="Alicante">Alicante</option>
            <option value="Madrid">Madrid</option>
            <option value="Sevilla">Sevilla</option>
            <option value="Valencia">Valencia</option>
        </select><br><br>

        <label for="descripcion">Descripcion</label><br>
        <textarea id="descripcion" name="descripcion" rows="5" cols="60"></textarea><br><br>

        <input type="checkbox" id="ofertas" name="ofertas" checked>
        <label for="ofertas">Deseo recibir informacion sobre novedades y ofertas</label><br><br>

        <input type="checkbox" id="condiciones" name="condiciones">
        <label for="condiciones">Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre proteccion de datos</label><br><br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
